<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinylVault · 黑胶宝库</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; line-height: 1.7; color: #333; }
        h1 { font-size: 1.6em; margin-bottom: 24px; }
        a { color: #3B6EA5; }
        .lang-switch { text-align: right; margin-bottom: 16px; }
        .lang-switch button { border: none; background: none; color: #3B6EA5; cursor: pointer; font-size: 0.9em; padding: 4px 8px; }
        .lang-switch button.active { font-weight: bold; }
        .lang-content { display: none; }
        .lang-content.active { display: block; }
    </style>
    <script>
        function setLang(lang) {
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-content').forEach(el => {
                el.classList.toggle('active', el.dataset.lang === lang);
            });
            document.querySelectorAll('.lang-switch button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });
            try { localStorage.setItem('vinylvault_lang', lang); } catch(e) {}
        }
        function init() {
            let saved = 'en';
            try { saved = localStorage.getItem('vinylvault_lang') || 'en'; } catch(e) {}
            setLang(saved);
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</head>
<body>
    <div class="lang-switch">
        <button data-lang="en" onclick="setLang('en')">English</button>
        <button data-lang="zh" onclick="setLang('zh')">中文</button>
    </div>
    <div class="lang-content active" data-lang="en">
        <h1>VinylVault · 黑胶宝库</h1>
        <p>Track, organize and value your vinyl collection.</p>
        <ul>
            <li><a href="privacy.html">Privacy Policy</a></li>
            <li><a href="support.html">Support</a></li>
        </ul>
    </div>
    <div class="lang-content" data-lang="zh">
        <h1>VinylVault · 黑胶宝库</h1>
        <p>整理、管理并估值你的黑胶收藏。</p>
        <ul>
            <li><a href="privacy.html">隐私政策</a></li>
            <li><a href="support.html">帮助</a></li>
        </ul>
    </div>
</body>
</html>
