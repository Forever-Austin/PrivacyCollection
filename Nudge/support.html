    <h1>轻推 Nudge 技术支持</h1>
    <p>感谢使用轻推！</p>

    <h2>常见问题</h2>
    <p><strong>Q: 提醒没有推送？</strong><br>A: 请确认已在「设置」→「通知权限」中授权通知。iOS 系统设置中也需要开启通知。</p>
    <p><strong>Q: 如何录制语音？</strong><br>A: 前往「设置」→「语音录制」，允许麦克风权限后即可录制。</p>
    <p><strong>Q: 数据会备份吗？</strong><br>A: 目前数据仅存储在本地。建议定期通过 iOS 系统备份保护数据。</p>
